name: Android (X-B0T)

# Gera o app Android do X-B0T:
# - X-B0T-apk-teste: APK para instalar direto no celular e testar.
# - X-B0T-play-store-aab: pacote .aab para enviar à Play Store
#   (assinado quando os secrets ANDROID_* estão configurados — ver X-B0T/play-store/PUBLICAR.md).
on:
  push:
    paths:
      - "X-B0T/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: X-B0T
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: X-B0T/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependências
        run: npm ci

      - name: Build do jogo e sincronização com o Android
        run: npm run android

      - name: Chave de assinatura da Play Store
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
            echo "Chave de assinatura configurada."
          else
            echo "::warning::Secret ANDROID_KEYSTORE_BASE64 não configurado: o .aab sai sem assinatura e a Play Store não aceita. O APK de teste funciona normalmente."
          fi

      - name: Compilar APK de teste e AAB da Play Store
        working-directory: X-B0T/android
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleDebug bundleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: X-B0T-apk-teste
          path: X-B0T/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: X-B0T-play-store-aab
          path: X-B0T/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
