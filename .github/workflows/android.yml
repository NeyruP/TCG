name: Android (X-B0T)

# Gera o X-B0T:
# - X-B0T-jogo-PC: zip do jogo para computador (abrir JOGAR.html; as cartas vão dentro dele).
# - X-B0T-apk-teste: APK para instalar direto no celular e testar.
# - X-B0T-play-store-aab: pacote .aab para enviar à Play Store
#   (assinado quando os secrets ANDROID_* estão configurados — ver X-B0T/play-store/PUBLICAR.md).
on:
  push:
    paths:
      - "X-B0T/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: X-B0T
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: X-B0T/package-lock.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependências
        run: npm ci

      - name: Build do jogo e sincronização com o Android
        run: npm run android

      - name: Chave de assinatura da Play Store
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
            echo "Chave de assinatura configurada."
          else
            echo "::warning::Secret ANDROID_KEYSTORE_BASE64 não configurado: o .aab sai sem assinatura e a Play Store não aceita. O APK de teste funciona normalmente."
          fi

      - name: Compilar APK de teste e AAB da Play Store
        working-directory: X-B0T/android
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleDebug bundleRelease

      - name: Conferir o APK e o AAB
        working-directory: X-B0T/android/app/build/outputs
        run: |
          AAPT2=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          "$AAPT2" dump badging apk/debug/app-debug.apk | grep -E "^package:|sdkVersion|targetSdkVersion|application-label:|launchable-activity"
          "$AAPT2" dump xmltree --file AndroidManifest.xml apk/debug/app-debug.apk | grep -A1 "screenOrientation"
          unzip -l apk/debug/app-debug.apk | grep -q "assets/public/index.html" || { echo "::error::index.html do jogo não está no APK"; exit 1; }
          CARTAS=$(unzip -l apk/debug/app-debug.apk | grep -c "assets/public/cards/.*\.jpg")
          echo "Imagens de cartas no APK: $CARTAS"
          [ "$CARTAS" -ge 31 ] || { echo "::error::Faltam imagens de cartas no APK"; exit 1; }
          if [ -n "$ANDROID_KEYSTORE_FILE" ]; then
            jarsigner -verify bundle/release/app-release.aab | tail -1
          fi

      - uses: actions/upload-artifact@v6
        with:
          name: X-B0T-jogo-PC
          path: |
            X-B0T/JOGAR.html
            X-B0T/INICIAR.bat
            X-B0T/README.md
          if-no-files-found: error

      - uses: actions/upload-artifact@v6
        with:
          name: X-B0T-apk-teste
          path: X-B0T/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v6
        with:
          name: X-B0T-play-store-aab
          path: X-B0T/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
